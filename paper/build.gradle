plugins {
    id 'java'
    id 'xyz.jpenilla.run-paper' version '3.0.2'
}

base {
    archivesName = 'MultiMine'
}

repositories {
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    // Public Paper API only (no server internals), so one jar runs on every version from the
    // oldest supported one up. Compile against the oldest supported version.
    compileOnly "io.papermc.paper:paper-api:${rootProject.paper_api_version}"
    implementation project(':core')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Bundle the core classes into the plugin jar.
jar {
    archiveVersion = "${version}+${rootProject.paper_jar_mc_range}"
    from(project(':core').sourceSets.main.output)
    // Only public API is used, so tell Paper the jar needs no remapping on load.
    manifest.attributes('paperweight-mappings-namespace': 'mojang')
}

tasks.named('runServer') {
    // Override with -Ppaper_run_version=<version>. Java 25 runs every supported version.
    minecraftVersion(rootProject.paper_run_version)
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
