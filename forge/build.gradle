plugins {
    id 'dev.architectury.loom-no-remap'
    id 'architectury-plugin'
    id 'com.gradleup.shadow'
}

base {
    archivesName = 'MultiMine-forge'
}

architectury {
    minecraft = rootProject.minecraft_version
    platformSetupLoomIde()
    forge()
}

configurations {
    common
    shadowCommon // Kept separate from the shadow plugin's own configuration so IDEs don't index it.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    // No developmentForge.extendsFrom common: Architectury's dev transformer would turn the common jar into a
    // second, generated Forge mod that clashes with this one. Common needs no transforming (no @ExpectPlatform),
    // so dev runs load it directly as part of this mod (see MOD_CLASSES below).
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    forge "net.minecraftforge:forge:${rootProject.forge_version}"

    common(project(path: ':common')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionForge')) { transitive = false }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

loom {
    forge {
        mixinConfig 'multimine.mixins.json'
    }
    // Forge's dev bootstrap groups directories into one mod using MOD_CLASSES. Loom doesn't set it for
    // unobfuscated Forge, so without this the classes, resources and common jar load as separate (broken) modules.
    runs.configureEach {
        def paths = sourceSets.main.output.classesDirs.files + [sourceSets.main.output.resourcesDir] + configurations.common.files
        environmentVariable 'MOD_CLASSES', paths.collect { "multimine%%${it}" }.join(File.pathSeparator)
    }
}
