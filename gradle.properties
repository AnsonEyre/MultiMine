org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_version=1.3.1
maven_group=net.sideways_sky

# Paper. Compiled against the oldest supported version's API; runs on that and everything newer.
paper_api_version=1.21.11-R0.1-SNAPSHOT
# Version :paper:runServer starts. Switch to test other versions.
paper_run_version=1.21.11
# Minecraft versions the Paper jar was tested on. Goes in the jar name.
paper_jar_mc_range=1.21.11-26.3

# Mod loaders (Architectury). Built against the newest Minecraft version. The jars declare
# 26.1 and up (fabric.mod.json, neoforge.mods.toml) and were tested on every version in
# mod_jar_mc_range, which goes in the jar name. 1.21.11 jars come from the mc/1.21.11 branch.
minecraft_version=26.3
fabric_loader_version=0.20.1
fabric_api_version=0.167.0+26.3
neoforge_version=26.3.0.118
mod_jar_mc_range=26.1-26.3
