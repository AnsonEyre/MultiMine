plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

base {
    archivesName = 'MultiMine-fabric'
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.fabric_minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    implementation project(':common')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

// Bundle the common classes into the mod jar.
jar {
    from(project(':common').sourceSets.main.output)
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}
