plugins {
    id 'dev.architectury.loom-no-remap'
    id 'architectury-plugin'
    id 'com.gradleup.shadow'
}

base {
    archivesName = 'MultiMine-fabric'
}

architectury {
    minecraft = rootProject.minecraft_version
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon // Kept separate from the shadow plugin's own configuration so IDEs don't index it.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    common(project(path: ':common')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
}

assemble.dependsOn shadowJar
