pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Architectury'
            url = 'https://maven.architectury.dev/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'PaperMC'
            url = 'https://repo.papermc.io/repository/maven-public/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'MultiMine'

// core: plain Java, no Minecraft dependency. The mining logic, shared by the Paper plugin and the mod.
include 'core'
// paper: the Paper plugin.
include 'paper'
// common: Architectury common module. Minecraft-side mod code (mixins, platform impl) shared by every loader.
// fabric / neoforge / forge: thin loader entrypoints.
include 'common', 'fabric', 'neoforge', 'forge'
